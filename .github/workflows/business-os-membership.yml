name: ProPulse to Business OS Membership
on:
  pull_request:
    paths:
      - 'backend/src/services/membershipAccessService.js'
      - 'backend/src/routes/oauthRoutes.js'
      - 'backend/scripts/check-propulse-oauth-provider.js'
      - 'backend/package.json'
      - 'backend/package-lock.json'
      - '.github/workflows/business-os-membership.yml'
permissions:
  contents: read
jobs:
  verified-membership:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Verify OAuth PKCE, subject isolation and paid Growth/Scale access
        working-directory: backend
        run: node scripts/check-propulse-oauth-provider.js
      - name: Check patched backend runtime dependencies
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high
