name: Hostinger Prebuild Frontend

on:
  push:
    branches:
      - feature/hostinger-business-deployment

permissions:
  contents: write

concurrency:
  group: hostinger-prebuild-frontend
  cancel-in-progress: true

jobs:
  prebuild:
    if: ${{ !contains(github.event.head_commit.message, '[hostinger-prebuilt]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment branch
        uses: actions/checkout@v4
        with:
          ref: feature/hostinger-business-deployment
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install root dependencies
        run: npm install --no-audit --no-fund

      - name: Bake frontend release marker
        run: |
          node -e "require('fs').writeFileSync('frontend/public/release.json', JSON.stringify({commit:process.env.GITHUB_SHA,environment:'production',builtAt:new Date().toISOString()})+'\\n')"
          cat frontend/public/release.json

      - name: Build Hostinger frontend
        env:
          VITE_API_URL: /api
          VITE_PUBLIC_SITE_URL: https://sghomesinterior.in
        run: npm run build

      - name: Bundle frontend inside backend publish root
        run: |
          rm -rf backend/hostinger-frontend
          cp -R frontend/dist backend/hostinger-frontend

      - name: Verify frontend output
        run: |
          test -f frontend/dist/index.html
          test -d frontend/dist/assets
          test -f frontend/dist/release.json
          test -f backend/hostinger-frontend/index.html
          test -d backend/hostinger-frontend/assets
          test -f backend/hostinger-frontend/release.json
          echo "Frontend build, release marker and backend publish bundle are ready."

      - name: Bake Hostinger release identity
        run: |
          node -e "require('fs').writeFileSync('backend/hostinger-release.json', JSON.stringify({commit:process.env.GITHUB_SHA,builtAt:new Date().toISOString()})+'\\n')"
          cat backend/hostinger-release.json

      - name: Commit prebuilt frontend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f frontend/dist backend/hostinger-frontend backend/hostinger-release.json
          if git diff --cached --quiet; then
            echo "No frontend build changes to commit."
            exit 0
          fi
          git commit -m "Prebuild Hostinger frontend [hostinger-prebuilt]"
          git push origin HEAD:feature/hostinger-business-deployment

      - name: Wait for Hostinger production deployment
        working-directory: backend
        env:
          DEPLOY_BASE_URL: https://sghomesinterior.in
          DEPLOY_EXPECTED_COMMIT: ${{ github.sha }}
          DEPLOY_EXPECTED_ENVIRONMENT: production
          DEPLOY_WAIT_SECONDS: '900'
          DEPLOY_POLL_SECONDS: '10'
        run: node scripts/wait-for-deployment.js

      - name: Run Hostinger production smoke
        working-directory: backend
        env:
          DEPLOY_BASE_URL: https://sghomesinterior.in
          DEPLOY_APP_ORIGIN: https://sghomesinterior.in
          DEPLOY_EXPECTED_COMMIT: ${{ github.sha }}
          DEPLOY_EXPECTED_ENVIRONMENT: production
        run: node scripts/check-deployed-smoke.js
