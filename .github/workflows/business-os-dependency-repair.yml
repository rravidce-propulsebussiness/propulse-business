name: Business OS provider dependency repair (feature only)
on:
  push:
    branches: [feature/business-os-growth-scale-membership-20261027]
    paths:
      - '.github/workflows/business-os-dependency-repair.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.repository == 'rravidce-propulsebussiness/propulse-business'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Apply compatible vulnerability patches
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm audit fix
          npm audit --omit=dev --audit-level=high
          node scripts/check-propulse-oauth-provider.js
      - name: Commit patched backend lockfile only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json backend/package.json
          if ! git diff --cached --quiet; then
            git commit -m "Patch provider runtime dependencies for OAuth membership rollout"
            git push origin HEAD:refs/heads/feature/business-os-growth-scale-membership-20261027
          fi
