name: Video Thumbnail and Original Sound Checks

on:
  pull_request:
    paths:
      - 'video-redactor/**'
      - '.github/workflows/video-thumbnail-tests.yml'
  push:
    branches: [main]
    paths:
      - 'video-redactor/**'
      - '.github/workflows/video-thumbnail-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preserve-video:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: video-redactor/requirements.txt
      - name: Install FFmpeg and Python libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -r video-redactor/requirements.txt
      - name: Verify original frames, audio and generated JPEG frames
        run: |
          python -m compileall -q video-redactor
          python -m unittest discover -s video-redactor -p 'test_*.py' -v
