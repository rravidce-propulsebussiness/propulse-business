name: Fix investor lead visibility

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix investor lead visibility'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove investment eligibility gate from assigned leads
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/src/services/investorAdminOperationsService.js')
          s = p.read_text()
          old = """    JOIN investments x ON x.user_id=$1 AND x.industry_id=l.industry_id AND x.status IN ('active','matured','paid') AND (x.state_id IS NULL OR l.state_id=x.state_id) AND (x.city_id IS NULL OR l.city_id=x.city_id) ${extra}
    WHERE l.investor_user_id=$1"""
          new = """    WHERE l.investor_user_id=$1"""
          if old not in s:
              raise SystemExit('Expected investor eligibility JOIN was not found')
          s = s.replace(old, new, 1)
          s = s.replace("  const values = [Number(investorId)];\n  const extra = investmentId ? 'AND x.id=$2' : '';\n  if (investmentId) values.push(Number(investmentId));", "  const values = [Number(investorId)];")
          p.write_text(s)
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/src/services/investorAdminOperationsService.js .github/workflows/fix-investor-lead-visibility.yml
          git commit -m "Fix investor lead visibility"
          git push
