name: Fix ad spend auto allocation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix ad spend auto allocation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch ad spend recording
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/src/services/investorAdminOperationsService.js')
          s = p.read_text()
          old = """    const allocation = (await client.query(`SELECT aa.id,aa.amount,aa.status,COALESCE((SELECT SUM(s.amount) FROM investment_ad_spends s WHERE s.allocation_id=aa.id),0) AS spent FROM investment_ad_allocations aa WHERE aa.investment_id=$1 AND aa.status IN ('allocated','spending') ORDER BY aa.id DESC LIMIT 1 FOR UPDATE`,[Number(investmentId)])).rows[0];
    if (!allocation) throw Object.assign(new Error('Allocate an ad budget before recording ad spend'), { code:'NO_AD_ALLOCATION' });
    const allocated=Number(allocation.amount); const spent=Number(allocation.spent||0); const remaining=Math.max(0,allocated-spent);
"""
          new = """    let allocation = (await client.query(`SELECT aa.id,aa.amount,aa.status,COALESCE((SELECT SUM(s.amount) FROM investment_ad_spends s WHERE s.allocation_id=aa.id),0) AS spent FROM investment_ad_allocations aa WHERE aa.investment_id=$1 AND aa.status IN ('allocated','spending') ORDER BY aa.id DESC LIMIT 1 FOR UPDATE`,[Number(investmentId)])).rows[0];
    // Admin's Add Ad Spend action is the manual workflow: if no active allocation exists,
    // create one from the requested spend amount, provided it fits the remaining capital.
    if (!allocation) {
      const totalSpent = Number((await client.query(`SELECT COALESCE(SUM(amount),0) AS total FROM investment_ad_spends WHERE investment_id=$1`,[Number(investmentId)])).rows[0].total || 0);
      const available = Math.max(0, Number(investment.amount) - totalSpent);
      if (value > available) throw Object.assign(new Error(`Ad spend cannot exceed the funds available for ads: ${available.toFixed(2)}`), { code:'SPEND_EXCEEDS_AVAILABLE_AD_FUNDS' });
      allocation = (await client.query(`INSERT INTO investment_ad_allocations(investment_id,amount,status,created_by) VALUES($1,$2,'allocated',$3) RETURNING id,amount,status,0::numeric AS spent`,[Number(investmentId),value,Number(adminId)])).rows[0];
    }
    const allocated=Number(allocation.amount); const spent=Number(allocation.spent||0); const remaining=Math.max(0,allocated-spent);
"""
          if old not in s:
              raise SystemExit('Expected ad spend allocation block was not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Update controller error mapping
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/src/controllers/investmentController.js')
          s = p.read_text()
          old = "async function recordAdSpend(req,res){try{return res.status(201).json(await adminOps.recordAdSpend({investmentId:Number(req.params.id),amount:req.body.amount,platform:req.body.platform,campaign:req.body.campaign,spendDate:req.body.spendDate,reference:req.body.reference,notes:req.body.notes,adminId:req.user.id}))}catch(e){const map={NOT_FOUND:404,CANCELLED:400,INVALID_SPEND_AMOUNT:400,NO_AD_ALLOCATION:400,SPEND_EXCEEDS_ALLOCATION:400};return res.status(map[e.code]||500).json({error:e.message||'Failed to record ad spend',code:e.code})}}"
          new = "async function recordAdSpend(req,res){try{return res.status(201).json(await adminOps.recordAdSpend({investmentId:Number(req.params.id),amount:req.body.amount,platform:req.body.platform,campaign:req.body.campaign,spendDate:req.body.spendDate,reference:req.body.reference,notes:req.body.notes,adminId:req.user.id}))}catch(e){const map={NOT_FOUND:404,CANCELLED:400,INVALID_SPEND_AMOUNT:400,NO_AD_ALLOCATION:400,SPEND_EXCEEDS_ALLOCATION:400,SPEND_EXCEEDS_AVAILABLE_AD_FUNDS:400};return res.status(map[e.code]||500).json({error:e.message||'Failed to record ad spend',code:e.code})}}"
          if old not in s:
              raise SystemExit('Expected recordAdSpend controller was not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/src/services/investorAdminOperationsService.js backend/src/controllers/investmentController.js
          git commit -m 'Fix ad spend auto allocation'
          git push
