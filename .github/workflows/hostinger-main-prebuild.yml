name: Hostinger Main Prebuild

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'frontend/dist/**'
      - 'backend/hostinger-frontend/**'
      - 'backend/hostinger-release.json'
      - 'backend/scripts/check-*.js'
      - 'frontend/scripts/check-*'
      - 'frontend/e2e/**'
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: write

jobs:
  prebuild:
    if: ${{ !contains(github.event.head_commit.message, '[hostinger-prebuilt]') }}
    concurrency:
      group: hostinger-main-production-prebuild
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install root dependencies
        run: npm install --no-audit --no-fund

      - name: Bake production release markers
        run: |
          node -e "require('fs').writeFileSync('frontend/public/release.json', JSON.stringify({commit:process.env.GITHUB_SHA,environment:'production',builtAt:new Date().toISOString()})+'\\n')"
          node -e "require('fs').writeFileSync('backend/hostinger-release.json', JSON.stringify({commit:process.env.GITHUB_SHA,environment:'production',builtAt:new Date().toISOString()})+'\\n')"
          cat frontend/public/release.json
          cat backend/hostinger-release.json

      - name: Build frontend
        env:
          VITE_API_URL: /api
          VITE_PUBLIC_SITE_URL: https://sghomesinterior.in
        run: npm run build

      - name: Refresh single backend deploy bundle
        run: |
          rm -rf backend/hostinger-frontend
          cp -R frontend/dist backend/hostinger-frontend
          test -f backend/hostinger-frontend/index.html
          test -d backend/hostinger-frontend/assets

      - name: Commit fresh Hostinger bundle
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main advanced during the build; a newer run will build the latest source."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f frontend/dist backend/hostinger-frontend backend/hostinger-release.json
          if git diff --cached --quiet; then
            echo "Hostinger bundle is already current."
            exit 0
          fi
          git commit -m "Prebuild Hostinger backend frontend [hostinger-prebuilt]"
          if ! git push origin HEAD:main; then
            git fetch origin main
            if [ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]; then
              echo "main advanced during the push; a newer run will build the latest source."
              exit 0
            fi
            echo "Hostinger prebuild push failed while main was unchanged."
            exit 1
          fi

      - name: Wait for Hostinger production deployment
        working-directory: backend
        env:
          DEPLOY_BASE_URL: https://sghomesinterior.in
          DEPLOY_EXPECTED_COMMIT: ${{ github.sha }}
          DEPLOY_EXPECTED_ENVIRONMENT: production
          DEPLOY_WAIT_SECONDS: '900'
          DEPLOY_POLL_SECONDS: '10'
        run: node scripts/wait-for-deployment.js

      - name: Run Hostinger production smoke
        working-directory: backend
        env:
          DEPLOY_BASE_URL: https://sghomesinterior.in
          DEPLOY_APP_ORIGIN: https://sghomesinterior.in
          DEPLOY_EXPECTED_COMMIT: ${{ github.sha }}
          DEPLOY_EXPECTED_ENVIRONMENT: production
        run: node scripts/check-deployed-smoke.js
