name: Fix investment cycles UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Fix investment cycles UI') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch investment history rendering
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/admin/pages/AdminInvestments.jsx')
          text = path.read_text()
          old = "{cycles.slice(0, 1).map(cycle => {"
          new = "{cycles.map(cycle => {"
          if old not in text:
              raise SystemExit('Expected cycle rendering expression was not found')
          text = text.replace(old, new, 1)
          text = text.replace('<span className="cycle-eyebrow">LATEST CYCLE</span>', '<span className="cycle-eyebrow">INVESTMENT CYCLE</span>', 1)
          marker = "{cycles.length > 1 && <div className=\"admin-more-cycles\">+ {cycles.length - 1} additional investment cycle{cycles.length - 1 === 1 ? '' : 's'} · open the investor's history for older cycles</div>}"
          text = text.replace(marker, '', 1)
          path.write_text(text)
          PY
      - name: Commit UI fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/admin/pages/AdminInvestments.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Fix investment cycles UI"
          git push
