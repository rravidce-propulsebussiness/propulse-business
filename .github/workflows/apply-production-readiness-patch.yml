name: Apply verified production-readiness patch

on:
  push:
    branches:
      - fix/production-readiness-20261001

permissions:
  contents: write

jobs:
  apply:
    name: Apply audited fixes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decode and validate patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/production-readiness.patch.gz.b64 | gzip -dc > /tmp/production-readiness.patch
          git apply --check /tmp/production-readiness.patch

      - name: Apply verified source and regression fixes
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/production-readiness.patch
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("frontend/src/pages/LeadsV2.css")
          source = path.read_text(encoding="utf-8")

          def normalize_font_size(match):
              value = float(match.group(1))
              return "font-size:12px" if value < 12 else match.group(0)

          updated = re.sub(r"font-size:\\s*([0-9.]+)px", normalize_font_size, source)
          path.write_text(updated, encoding="utf-8")
          PY
          rm -f .github/production-readiness.patch.gz.b64
          rm -f .github/workflows/apply-production-readiness-patch.yml
          git diff --check

      - name: Commit applied fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close production-readiness regressions"
          git push origin HEAD:fix/production-readiness-20261001
