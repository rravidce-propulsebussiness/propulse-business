name: Investment Integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  investment-integrity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: investment_ci
          POSTGRES_USER: investment_ci
          POSTGRES_PASSWORD: investment_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U investment_ci -d investment_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Verify investor settings atomicity
        run: node scripts/check-admin-commercial-investor-atomicity.js
      - name: Verify coupon checkout integrity
        run: node scripts/check-coupon-checkout-integrity.js
      - name: Verify admin users pagination
        run: node scripts/check-admin-users-pagination.js
      - name: Verify city pagination
        run: node scripts/check-city-pagination.js
      - name: Verify subcity pagination
        run: node scripts/check-subcity-pagination.js
      - name: Verify shared rate-limit bucket
        run: node scripts/check-rate-limit-shared-bucket.js
      - name: Bootstrap database
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: investment_ci
          DB_USER: investment_ci
          DB_PASSWORD: investment_ci
        run: npm run db:bootstrap
      - name: Verify investment integrity
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: investment_ci
          DB_USER: investment_ci
          DB_PASSWORD: investment_ci
        run: node scripts/check-investment-integrity.js && node scripts/check-investment-revenue-allocation.js && node scripts/check-investment-no-fixed-return.js && node scripts/check-investment-reinvestment-integrity.js && node scripts/check-investment-reinvestment-choice.js
      - name: Verify backend syntax
        run: node --check src/services/couponService.js && node --check src/services/paymentService.js && node --check src/controllers/paymentController.js && node --check src/services/adminService.js && node --check src/services/cityService.js && node --check src/controllers/cityController.js && node --check src/controllers/subcityController.js && node --check src/middleware/rateLimitMiddleware.js && node --check src/services/investmentService.js && node --check src/services/leadPurchaseService.js && node --check src/services/adminCommercialService.js && node --check scripts/check-admin-commercial-investor-atomicity.js && node --check scripts/check-coupon-checkout-integrity.js && node --check scripts/check-admin-users-pagination.js && node --check scripts/check-city-pagination.js && node --check scripts/check-subcity-pagination.js && node --check scripts/check-rate-limit-shared-bucket.js
