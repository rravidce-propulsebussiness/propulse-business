name: Process ProPulse Project Videos

# Small-project alternative to a dedicated Docker VPS. This workflow reports
# a configuration failure until all five repository secrets are configured.
on:
  push:
    branches: [main]
    paths:
      - 'video-redactor/**'
      - '.github/workflows/project-video-redaction.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: propulse-private-video-redactor
  cancel-in-progress: false

jobs:
  redact-one:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      DATABASE_URL: ${{ secrets.PROPULSE_VIDEO_DATABASE_URL }}
      PRIVATE_OBJECT_STORAGE_ENDPOINT: ${{ secrets.PROPULSE_VIDEO_R2_ENDPOINT }}
      PRIVATE_OBJECT_STORAGE_BUCKET: ${{ secrets.PROPULSE_VIDEO_R2_BUCKET }}
      PRIVATE_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.PROPULSE_VIDEO_R2_ACCESS_KEY_ID }}
      PRIVATE_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.PROPULSE_VIDEO_R2_SECRET_ACCESS_KEY }}
      PRIVATE_OBJECT_STORAGE_REGION: auto
      VIDEO_REDACTOR_ONCE: '1'
      VIDEO_REDACTOR_OCR_LANGS: eng+tel
    steps:
      - uses: actions/checkout@v4

      - name: Check secure worker configuration
        id: configured
        shell: bash
        run: |
          missing=0
          for var in DATABASE_URL PRIVATE_OBJECT_STORAGE_ENDPOINT PRIVATE_OBJECT_STORAGE_BUCKET PRIVATE_OBJECT_STORAGE_ACCESS_KEY_ID PRIVATE_OBJECT_STORAGE_SECRET_ACCESS_KEY; do
            if [[ -z "${!var}" ]]; then
              missing=1
              echo "::error::Video redaction cannot start because ${var} is missing. Configure the corresponding PROPULSE_VIDEO_* repository secret in Settings > Secrets and variables > Actions."
            fi
          done
          if [[ "$missing" == "1" ]]; then
            echo "::error::Video processing did not run. All five PROPULSE_VIDEO_* secrets must be configured in GitHub Actions. The original video remains private."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.configured.outputs.ready == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: video-redactor/requirements.txt

      - name: Install local video privacy processor
        if: steps.configured.outputs.ready == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg tesseract-ocr tesseract-ocr-eng tesseract-ocr-tel libglib2.0-0 libgl1
          python -m pip install -r video-redactor/requirements.txt

      - name: Verify video redaction, targeted masking, and audio preservation
        if: steps.configured.outputs.ready == 'true'
        run: |
          python -m compileall -q video-redactor
          python -m unittest discover -s video-redactor -p 'test_*.py' -v

      - name: Process one queued video (source-matched redacted copy only)
        if: steps.configured.outputs.ready == 'true'
        run: python -u video-redactor/worker.py
