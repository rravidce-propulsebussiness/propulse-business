name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  backend:
    name: Backend install and syntax check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Syntax check
        run: npm test

  backend-startup:
    name: Backend startup and database smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ci_smoke
          POSTGRES_USER: ci_smoke
          POSTGRES_PASSWORD: ci_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_smoke -d ci_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Bootstrap database schema and catalog
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: ci_smoke
          DB_USER: ci_smoke
          DB_PASSWORD: ci_smoke
        run: npm run db:bootstrap
      - name: Start backend
        env:
          PORT: 5000
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: ci_smoke
          DB_USER: ci_smoke
          DB_PASSWORD: ci_smoke
          JWT_SECRET: ci-smoke-secret
        run: |
          node src/server.js > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
          for i in {1..30}; do
            if ! kill -0 "$(cat /tmp/backend.pid)" 2>/dev/null; then
              echo "Backend process exited unexpectedly."
              cat /tmp/backend.log
              exit 1
            fi
            status=$(curl --silent --show-error --output /tmp/backend-response.json --write-out '%{http_code}' http://127.0.0.1:5000/health || true)
            if [ "$status" = "200" ] && grep -q '"database":"connected"' /tmp/backend-response.json; then
              echo "Backend and PostgreSQL health check passed."
              cat /tmp/backend-response.json
              exit 0
            fi
            sleep 1
          done
          echo "Backend did not become healthy with a connected database."
          cat /tmp/backend.log
          cat /tmp/backend-response.json 2>/dev/null || true
          exit 1
      - name: Stop backend
        if: always()
        run: |
          if [ -f /tmp/backend.pid ]; then kill "$(cat /tmp/backend.pid)" 2>/dev/null || true; fi

  duplicate-scan:
    name: Duplicate code scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Detect exact duplicate files
        shell: bash
        run: |
          set -euo pipefail
          duplicates=$(git ls-files -z -- '*.js' '*.jsx' '*.ts' '*.tsx' '*.css' '*.json' | xargs -0 -r sha256sum | sort -k1,1 | awk 'last==$1 {print $1 "  " lastfile "  " $2} {last=$1; lastfile=$2}')
          if [ -n "$duplicates" ]; then
            echo "Exact duplicate tracked files detected:"
            echo "$duplicates"
            exit 1
          fi
          echo "No exact duplicate tracked source/config files found."
