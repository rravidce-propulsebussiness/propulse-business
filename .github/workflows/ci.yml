name: CI

on:
  push:
    branches:
      - main
      - 'security/**'
      - 'fix/**'
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Frontend source graph
        run: npm run test:source-graph
      - name: CSV export security
        run: npm run test:csv-security
      - name: User header layout
        run: npm run test:user-header-layout
      - name: Lead marketplace display
        run: npm run test:lead-marketplace-display
      - name: Payment proof preview
        run: npm run test:payment-proof-preview
      - name: Wallet history clarity
        run: npm run test:wallet-history
      - name: Wallet membership tab
        run: npm run test:wallet-membership-tab
      - name: Build
        run: npm run build
      - name: Google GIS regression checks
        run: npm run test:google-gis

  backend:
    name: Backend install and syntax check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Syntax check
        run: npm test

  backend-startup:
    name: Backend startup and database smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ci_smoke
          POSTGRES_USER: ci_smoke
          POSTGRES_PASSWORD: ci_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_smoke -d ci_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Bootstrap database schema and catalog
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: ci_smoke
          DB_USER: ci_smoke
          DB_PASSWORD: ci_smoke
        run: npm run db:bootstrap
      - name: Refuse bootstrap on populated database
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: ci_smoke
          DB_USER: ci_smoke
          DB_PASSWORD: ci_smoke
        shell: bash
        run: |
          set -euo pipefail
          if npm run db:bootstrap > /tmp/bootstrap-second.log 2>&1; then
            echo "db:bootstrap unexpectedly succeeded on a populated database."
            cat /tmp/bootstrap-second.log
            exit 1
          fi
          grep -q "requires an empty database" /tmp/bootstrap-second.log
          grep -q "db:migrate" /tmp/bootstrap-second.log
          echo "Populated-database bootstrap refusal passed."
      - name: Verify lead PIN location mapping
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: ci_smoke
          DB_USER: ci_smoke
          DB_PASSWORD: ci_smoke
        run: node scripts/check-lead-pincode-mapping.js
      - name: Verify lead pricing duplicate integrity
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: ci_smoke
          DB_USER: ci_smoke
          DB_PASSWORD: ci_smoke
        run: node scripts/check-lead-pricing-integrity.js
      - name: Verify membership duplicate integrity
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: ci_smoke
          DB_USER: ci_smoke
          DB_PASSWORD: ci_smoke
        run: node scripts/check-membership-integrity.js
      - name: Verify payment and wallet integrity
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: ci_smoke
          DB_USER: ci_smoke
          DB_PASSWORD: ci_smoke
        run: node scripts/check-payment-integrity.js
      - name: Verify Lead Partner ledger integrity
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: ci_smoke
          DB_USER: ci_smoke
          DB_PASSWORD: ci_smoke
        run: npm run test:ledger
      - name: Verify Lead Partner payout lifecycle
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: ci_smoke
          DB_USER: ci_smoke
          DB_PASSWORD: ci_smoke
        timeout-minutes: 3
        run: npm run test:payout
      - name: Verify production payment flow and startup
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: ci_smoke
          DB_USER: ci_smoke
          DB_PASSWORD: ci_smoke
        run: npm run test:production
      - name: Start backend
        env:
          PORT: 5000
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: ci_smoke
          DB_USER: ci_smoke
          DB_PASSWORD: ci_smoke
          JWT_SECRET: ci-smoke-secret
        run: |
          node src/server.js > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
          for i in {1..30}; do
            if ! kill -0 "$(cat /tmp/backend.pid)" 2>/dev/null; then
              echo "Backend process exited unexpectedly."
              cat /tmp/backend.log
              exit 1
            fi
            status=$(curl --silent --show-error --output /tmp/backend-response.json --write-out '%{http_code}' http://127.0.0.1:5000/health || true)
            if [ "$status" = "200" ] && grep -q '"database":"connected"' /tmp/backend-response.json; then
              echo "Backend and PostgreSQL health check passed."
              cat /tmp/backend-response.json
              exit 0
            fi
            sleep 1
          done
          echo "Backend did not become healthy with a connected database."
          cat /tmp/backend.log
          cat /tmp/backend-response.json 2>/dev/null || true
          exit 1
      - name: Stop backend
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /tmp/backend.pid ]; then
            pid="$(cat /tmp/backend.pid)"
            kill "$pid" 2>/dev/null || true
            for i in {1..20}; do
              if ! kill -0 "$pid" 2>/dev/null; then break; fi
              sleep 0.25
            done
          fi
          if grep -q "Graceful shutdown failed" /tmp/backend.log 2>/dev/null; then
            echo "Backend logged a graceful shutdown failure:"
            cat /tmp/backend.log
            exit 1
          fi

  duplicate-scan:
    name: Duplicate code scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Detect exact duplicate files
        shell: bash
        run: |
          set -euo pipefail
          duplicates=$(git ls-files -z -- '*.js' '*.jsx' '*.ts' '*.tsx' '*.css' '*.json' | xargs -0 -r sha256sum | sort -k1,1 | awk 'last==$1 {print $1 "  " lastfile "  " $2} {last=$1; lastfile=$2}')
          if [ -n "$duplicates" ]; then
            echo "Exact duplicate tracked source/config files detected:"
            echo "$duplicates"
            exit 1
          fi
          echo "No exact duplicate tracked source/config files found."

  production-static-scan:
    name: Production security/static scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Repository whitespace check
        run: git diff --check HEAD^ HEAD
      - name: Block committed environment files
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env|\.env\.[^.]*)$' | grep -vE '(^|/)(\.env\.example|\.env\.sample)$'; then
            echo "A real environment file is tracked. Remove it and rotate any exposed credentials."
            exit 1
          fi
      - name: Block tracked runtime uploads
        shell: bash
        run: |
          set -euo pipefail
          matches=$(git ls-files 'backend/uploads/**' | grep -vE '/\.gitkeep$' || true)
          if [ -n "$matches" ]; then
            echo "Runtime upload files must not be committed:"
            echo "$matches"
            exit 1
          fi
          echo "No runtime uploads are tracked."
      - name: Block hardcoded production localhost API URLs
        shell: bash
        run: |
          set -euo pipefail
          matches=$(git grep -nE "https?://localhost:[0-9]+/api" -- frontend/src ':!frontend/src/utils/api.js' || true)
          if [ -n "$matches" ]; then
            echo "Hardcoded localhost API URL found outside the shared API client:"
            echo "$matches"
            exit 1
          fi
      - name: Block common committed secrets
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nEI '(password|secret|access[_-]?token|private[_-]?key)[[:space:]]*[:=][[:space:]]*["'"'"'][^"'"'"']{12,}["'"'"']' -- ':!*.lock' ':!*.example' ':!*.sample' ':!backend/src/database/schema.sql'; then
            echo "Potential hardcoded secret detected. Review the matches before merging."
            exit 1
          fi

      - name: Block runtime fetch monkey patches
        shell: bash
        run: |
          set -euo pipefail
          matches=$(git grep -nE 'window\.fetch[[:space:]]*=' -- frontend/src || true)
          if [ -n "$matches" ]; then
            echo "Global window.fetch monkey patch detected:"
            echo "$matches"
            exit 1
          fi
          echo "No global fetch monkey patches found."

      - name: Block legacy browser auth token storage
        shell: bash
        run: |
          set -euo pipefail
          matches=$(git grep -n 'propulse_auth_token' -- frontend/src || true)
          if [ -n "$matches" ]; then
            echo "Legacy browser JWT storage reference detected:"
            echo "$matches"
            exit 1
          fi
          echo "No legacy browser JWT storage references found."

      - name: Block document.write
        shell: bash
        run: |
          set -euo pipefail
          matches=$(git grep -nE 'document\.write[[:space:]]*\(' -- frontend/src || true)
          if [ -n "$matches" ]; then
            echo "document.write usage detected:"
            echo "$matches"
            exit 1
          fi
          echo "No document.write usage found."

      - name: Block frontend Authorization headers
        shell: bash
        run: |
          set -euo pipefail
          matches=$(git grep -n 'Authorization' -- frontend/src || true)
          if [ -n "$matches" ]; then
            echo "Frontend Authorization header detected; browser auth must use HttpOnly cookies:"
            echo "$matches"
            exit 1
          fi
          echo "No frontend Authorization headers found."
