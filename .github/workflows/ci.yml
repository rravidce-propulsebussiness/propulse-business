name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend install and syntax check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  backend-startup:
    name: Backend startup and database smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ci_smoke
          POSTGRES_USER: ci_smoke
          POSTGRES_PASSWORD: ci_smoke
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci_smoke -d ci_smoke"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Bootstrap database
        env: { DB_HOST: 127.0.0.1, DB_PORT: 5432, DB_NAME: ci_smoke, DB_USER: ci_smoke, DB_PASSWORD: ci_smoke }
        run: npm run db:bootstrap
      - name: Verify PIN mapping
        env: { DB_HOST: 127.0.0.1, DB_PORT: 5432, DB_NAME: ci_smoke, DB_USER: ci_smoke, DB_PASSWORD: ci_smoke }
        run: node scripts/check-lead-pincode-mapping.js
      - name: Verify lead pricing duplicates
        env: { DB_HOST: 127.0.0.1, DB_PORT: 5432, DB_NAME: ci_smoke, DB_USER: ci_smoke, DB_PASSWORD: ci_smoke }
        run: node scripts/check-lead-pricing-integrity.js
      - name: Verify membership duplicates
        env: { DB_HOST: 127.0.0.1, DB_PORT: 5432, DB_NAME: ci_smoke, DB_USER: ci_smoke, DB_PASSWORD: ci_smoke }
        run: node scripts/check-membership-integrity.js
      - name: Verify investment reinvestment integrity
        env: { DB_HOST: 127.0.0.1, DB_PORT: 5432, DB_NAME: ci_smoke, DB_USER: ci_smoke, DB_PASSWORD: ci_smoke }
        run: node scripts/check-investment-reinvestment-integrity.js
      - name: Start backend
        env: { PORT: 5000, DB_HOST: 127.0.0.1, DB_PORT: 5432, DB_NAME: ci_smoke, DB_USER: ci_smoke, DB_PASSWORD: ci_smoke, JWT_SECRET: ci-smoke-secret }
        run: |
          node src/server.js > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
          for i in {1..30}; do
            if ! kill -0 "$(cat /tmp/backend.pid)" 2>/dev/null; then cat /tmp/backend.log; exit 1; fi
            status=$(curl --silent --output /tmp/backend-response.json --write-out '%{http_code}' http://127.0.0.1:5000/health || true)
            if [ "$status" = "200" ] && grep -q '"database":"connected"' /tmp/backend-response.json; then exit 0; fi
            sleep 1
          done
          cat /tmp/backend.log; cat /tmp/backend-response.json 2>/dev/null || true; exit 1

  duplicate-scan:
    name: Duplicate code scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect exact duplicate files
        shell: bash
        run: |
          set -euo pipefail
          duplicates=$(git ls-files -z -- '*.js' '*.jsx' '*.ts' '*.tsx' '*.css' '*.json' | xargs -0 -r sha256sum | sort -k1,1 | awk 'last==$1 {print $1 "  " lastfile "  " $2} {last=$1; lastfile=$2}')
          if [ -n "$duplicates" ]; then echo "$duplicates"; exit 1; fi

  production-static-scan:
    name: Production security/static scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block committed environment files
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env|\.env\.[^.]*)$' | grep -vE '(^|/)(\.env\.example|\.env\.sample)$'; then exit 1; fi
      - name: Block hardcoded production localhost API URLs
        shell: bash
        run: |
          set -euo pipefail
          matches=$(git grep -nE "https?://localhost:[0-9]+/api" -- frontend/src ':!frontend/src/utils/api.js' || true)
          if [ -n "$matches" ]; then echo "$matches"; exit 1; fi
