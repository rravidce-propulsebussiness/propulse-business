name: Validate one-process Hostinger fix (temporary)
on:
  push:
    branches:
      - fix/hostinger-auth-503-single-process-20261024
    paths:
      - 'index.js'
      - 'hostinger-server.js'
      - 'backend/scripts/check-hostinger-single-app.js'
      - '.github/workflows/verify-hostinger-single-process-temporary.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate launcher syntax
        run: |
          node --check index.js
          node --check hostinger-server.js
          node --check backend/scripts/check-hostinger-single-app.js
      - name: Verify single-process Hostinger deployment assertions
        run: node backend/scripts/check-hostinger-single-app.js
      - name: Remove temporary test workflow from the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/verify-hostinger-single-process-temporary.yml
          git commit -m "Complete focused Hostinger launcher checks"
          git push origin HEAD:fix/hostinger-auth-503-single-process-20261024
