name: Add lead location regression CI

on:
  push:
    branches:
      - fix/lead-pincode-location-mapping

permissions:
  contents: write

jobs:
  update-ci:
    if: ${{ !contains(github.event.head_commit.message, '[lead-mapping-ci-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add regression test to database smoke job
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/ci.yml')
          s=p.read_text()
          marker='''      - name: Verify lead PIN location mapping\n        env:\n          DB_HOST: 127.0.0.1\n          DB_PORT: 5432\n          DB_NAME: ci_smoke\n          DB_USER: ci_smoke\n          DB_PASSWORD: ci_smoke\n        run: node scripts/check-lead-pincode-mapping.js\n'''
          anchor='''      - name: Start backend\n'''
          if 'check-lead-pincode-mapping.js' not in s:
              if anchor not in s: raise SystemExit('CI anchor not found')
              s=s.replace(anchor, marker+'      - name: Start backend\n',1)
              p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml
          git commit -m "Add lead location mapping regression test [lead-mapping-ci-applied]" || true
          git push origin HEAD:fix/lead-pincode-location-mapping
