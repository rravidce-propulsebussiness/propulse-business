    <!-- Critical, self-contained first paint. Keeps reloads styled before Vite,
         the auth session request, and lazy route chunks have finished. -->
    <style>
      html { background: #fff; }
      body { margin: 0; }
      #root { min-height: 100vh; min-height: 100svh; }
      .pp-loading-shell { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; background: #fff; color: #102f46; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .pp-loading-header { box-sizing: border-box; display: flex; align-items: center; height: 68px; padding: 0 max(24px, calc((100vw - 1380px) / 2)); background: #fff; border-bottom: 1px solid #e9edf0; }
      .pp-loading-logo { display: block; width: 124px; height: auto; max-height: 45px; object-fit: contain; }
      .pp-loading-hero { flex: 1; min-height: 420px; background: #103b91; background-image: linear-gradient(rgba(255,255,255,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.08) 1px, transparent 1px), linear-gradient(118deg, #112d74, #1646a7); background-size: 46px 46px, 46px 46px, auto; display: grid; place-items: center; padding: 32px 24px; }
      .pp-loading-content { width: min(1120px, 100%); }
      .pp-loading-kicker { display: block; font-size: 11px; font-weight: 750; letter-spacing: .18em; color: #ffc0a2; }
      .pp-loading-line { display: block; width: min(560px, 85%); height: 39px; margin-top: 20px; border-radius: 8px; background: rgba(255,255,255,.16); }
      .pp-loading-line-short { width: min(410px, 70%); margin-top: 13px; }
      .pp-loading-indicator { display: block; width: 120px; height: 4px; margin-top: 35px; border-radius: 999px; background: rgba(255,255,255,.18); overflow: hidden; }
      .pp-loading-indicator::after { content: ''; display: block; width: 45%; height: 100%; background: #ff7947; border-radius: inherit; animation: pp-first-paint-progress 1.25s ease-in-out infinite alternate; }
      .pp-loading-a11y { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
      @keyframes pp-first-paint-progress { to { transform: translateX(125%); } }
      @media (max-width: 650px) { .pp-loading-header { height: 62px; padding: 0 20px; } .pp-loading-hero { min-height: 430px; } .pp-loading-line { height: 30px; } }
      @media (prefers-reduced-motion: reduce) { .pp-loading-indicator::after { animation: none; } }
    </style>

        </header>
        <main class="pp-loading-hero">

            <span class="pp-loading-kicker">BUILDING SPACES. ELEVATING LIVES</span>
            <span class="pp-loading-line"></span>
            <span class="pp-loading-line pp-loading-line-short"></span>
            <span class="pp-loading-indicator"></span>
          </div>
          <span class="pp-loading-a11y">Loading ProPulse website</span>
        </main>
      </div>
